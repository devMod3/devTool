name: Format Cycle

on:
  push:
    branches: [feature/draggable-window-forensic-guide]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/draggable-window-forensic-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write "deuda técnica.md" "docs/GUIA_FORENSE_DE_USO.md" "packages/extension/src/presentation/draggable-window.ts"
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deuda técnica.md" docs/GUIA_FORENSE_DE_USO.md packages/extension/src/presentation/draggable-window.ts
          git commit -m "style: apply canonical formatting"
          git push
